spring.application.name=com.netflix.clone
server.port=8088

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pulsescreen_video}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart media uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=2GB
server.tomcat.max-http-form-post-size=2GB

# Media storage
file.upload.video-dir=uploads/videos
file.upload.image-dir=uploads/images

# SMTP mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend links and CORS
app.frontend.url=${FRONTEND_URL:http://localhost:8088}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088}

# JWT signing secret must be supplied as an environment variable
jwt.secret=${JWT_SECRET}

# Optional initial administrator account. Set both ADMIN_EMAIL and ADMIN_PASSWORD
# in the run configuration to create/upgrade the administrator on application startup.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
